[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moa-course-project"
version = "0.1.0"
description = "Setup and launch helpers for the original Mechanism of Action experiments"
requires-python = ">=3.10,<3.12"

[project.scripts]
moa = "moa.__main__:main"

[tool.setuptools]
packages = ["moa"]
